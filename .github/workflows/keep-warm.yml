name: Keep live site warm

# Render's free tier sleeps after 15 minutes idle, and the first visit after
# that takes ~30-50 s. Pinging a DB-free endpoint every 10 minutes keeps the
# web service awake while letting the Neon database scale to zero.
# One always-on free service uses ~744 of Render's 750 free hours a month.
# Disable this workflow in the Actions tab if you'd rather save those hours.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Ping
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://aaroh-6j4z.onrender.com/api/ping
