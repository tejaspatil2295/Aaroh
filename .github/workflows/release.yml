name: Release Android app

# Builds a signed APK (direct install) and AAB (Google Play) pointed at your live server,
# then publishes them on the repository's Releases page.
# Needs repository secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version name, e.g. 1.0.0"
        required: true
        default: "1.0.0"
      api_url:
        description: "Live server address baked into the app"
        required: true
        default: "https://aaroh-6j4z.onrender.com"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - name: Check signing secrets
        env: { KS: "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" }
        run: |
          if [ -z "$KS" ]; then
            echo "::error::Add the ANDROID_KEYSTORE_* secrets first (Settings → Secrets and variables → Actions)."
            exit 1
          fi
      - run: npm ci
      - name: Build web bundle for the live server
        run: npm run build && npx cap sync android
        env: { VITE_API_URL: "${{ inputs.api_url }}" }
      - name: Build signed APK and AAB
        working-directory: web/android
        env:
          KS: "${{ secrets.ANDROID_KEYSTORE_BASE64 }}"
          KS_PASS: "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
          KEY_ALIAS: "${{ secrets.ANDROID_KEY_ALIAS }}"
          KEY_PASS: "${{ secrets.ANDROID_KEY_PASSWORD }}"
        run: |
          # Tolerate stray spaces/newlines from copy-pasting the secrets
          KS_PASS="$(printf '%s' "$KS_PASS" | tr -d '\r\n')"; KS_PASS="${KS_PASS#"${KS_PASS%%[![:space:]]*}"}"; KS_PASS="${KS_PASS%"${KS_PASS##*[![:space:]]}"}"
          KEY_PASS="$(printf '%s' "$KEY_PASS" | tr -d '\r\n')"; KEY_PASS="${KEY_PASS#"${KEY_PASS%%[![:space:]]*}"}"; KEY_PASS="${KEY_PASS%"${KEY_PASS##*[![:space:]]}"}"
          KEY_ALIAS="$(printf '%s' "$KEY_ALIAS" | tr -d '[:space:]')"
          printf '%s' "$KS" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "keystore: $(wc -c < "$RUNNER_TEMP/release.keystore") bytes; password length ${#KS_PASS}; key password length ${#KEY_PASS}; alias length ${#KEY_ALIAS}"
          if ! keytool -list -keystore "$RUNNER_TEMP/release.keystore" -storepass "$KS_PASS" >/dev/null 2>&1; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD does not open the keystore in ANDROID_KEYSTORE_BASE64. Re-paste both from the android-signing folder."
            exit 1
          fi
          keytool -list -keystore "$RUNNER_TEMP/release.keystore" -storepass "$KS_PASS" -alias "$KEY_ALIAS" >/dev/null 2>&1 || { echo "::error::ANDROID_KEY_ALIAS should be: aaroh"; exit 1; }
          ./gradlew assembleRelease bundleRelease \
            -Pandroid.injected.version.code=${{ github.run_number }} \
            -Pandroid.injected.version.name=${{ inputs.version }} \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore" \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/release/*.apk "$GITHUB_WORKSPACE/out/aaroh-${{ inputs.version }}.apk"
          cp app/build/outputs/bundle/release/*.aab "$GITHUB_WORKSPACE/out/aaroh-${{ inputs.version }}.aab"
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$GITHUB_WORKSPACE/out/aaroh-${{ inputs.version }}.apk" | head -3
      - name: Publish release
        working-directory: .
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release create "v${{ inputs.version }}" out/* \
            --title "AAROH ${{ inputs.version }}" \
            --notes "Android app for AAROH, connected to ${{ inputs.api_url }}.

          **Install on your phone:** download \`aaroh-${{ inputs.version }}.apk\`, open it and allow \"Install unknown apps\". Newer versions install over this one and keep you signed in.

          \`aaroh-${{ inputs.version }}.aab\` is for uploading to Google Play."
